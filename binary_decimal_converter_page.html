<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schmidty | Binary Converter</title>
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            accent: '#06b6d4',
                            pink: '#ec4899'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="shared_stylesheet.css">
    <script src="shared_application_logic.js" defer></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans transition-colors duration-300 min-h-screen flex flex-col">

    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <header class="sticky top-0 z-40 w-full glass border-b border-slate-200/50 dark:border-slate-800/50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="index.html" class="flex items-center gap-2.5 text-xl font-heading font-extrabold tracking-tight">
                    <span class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 via-brand-accent to-brand-pink flex items-center justify-center text-white font-bold">S</span>
                    <span class="text-lg font-bold bg-gradient-to-r from-slate-900 to-slate-700 dark:from-white dark:to-slate-300 bg-clip-text text-transparent">Schmidty</span>
                </a>

                <nav class="hidden md:flex items-center gap-1 bg-slate-200/50 dark:bg-slate-900/80 p-1.5 rounded-full border border-slate-300/50 dark:border-slate-800">
                    <a href="index.html" class="px-4 py-1.5 text-xs font-semibold rounded-full text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white"><i class="fa-solid fa-house mr-1.5"></i>Home</a>
                    <a href="hobbies_page.html" class="px-4 py-1.5 text-xs font-semibold rounded-full text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white"><i class="fa-solid fa-gamepad mr-1.5"></i>Hobbies</a>
                    <a href="projects_showcase_page.html" class="px-4 py-1.5 text-xs font-semibold rounded-full text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white"><i class="fa-solid fa-code-fork mr-1.5"></i>Projects</a>
                    <a href="binary_decimal_converter_page.html" class="active px-4 py-1.5 text-xs font-semibold rounded-full text-brand-600 dark:text-brand-400 bg-white dark:bg-slate-800 shadow-sm"><i class="fa-solid fa-calculator mr-1.5"></i>Binary</a>
                    <a href="interactive_crossword_puzzle_page.html" class="px-4 py-1.5 text-xs font-semibold rounded-full text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white"><i class="fa-solid fa-puzzle-piece mr-1.5"></i>Crossword</a>
                </nav>

                <div class="flex items-center gap-3">
                    <button id="theme-toggle" class="px-3.5 py-1.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white/80 dark:bg-slate-800/80 text-xs font-semibold text-slate-700 dark:text-slate-200 flex items-center gap-2 shadow-sm">
                        <i id="theme-icon" class="fa-solid fa-moon text-brand-500"></i>
                        <span id="theme-text">Switch Theme</span>
                    </button>
                    <button onclick="toggleMobileMenu()" class="md:hidden p-2 rounded-lg text-slate-600 dark:text-slate-300"><i id="menu-icon" class="fa-solid fa-bars text-xl"></i></button>
                </div>
            </div>
        </div>

        <div id="mobile-menu" class="hidden md:hidden border-b border-slate-200 dark:border-slate-800 bg-white/95 dark:bg-slate-950/95 px-4 pt-2 pb-4 space-y-2">
            <a href="index.html" class="block px-4 py-2.5 rounded-xl text-sm font-medium text-slate-600 dark:text-slate-400"><i class="fa-solid fa-house mr-3"></i>Home</a>
            <a href="hobbies_page.html" class="block px-4 py-2.5 rounded-xl text-sm font-medium text-slate-600 dark:text-slate-400"><i class="fa-solid fa-gamepad mr-3"></i>Hobbies</a>
            <a href="projects_showcase_page.html" class="block px-4 py-2.5 rounded-xl text-sm font-medium text-slate-600 dark:text-slate-400"><i class="fa-solid fa-code-fork mr-3"></i>Projects</a>
            <a href="binary_decimal_converter_page.html" class="block px-4 py-2.5 rounded-xl text-sm font-medium bg-brand-50 dark:bg-brand-900/20 text-brand-600 dark:text-brand-400"><i class="fa-solid fa-calculator mr-3"></i>Binary Converter</a>
            <a href="interactive_crossword_puzzle_page.html" class="block px-4 py-2.5 rounded-xl text-sm font-medium text-slate-600 dark:text-slate-400"><i class="fa-solid fa-puzzle-piece mr-3"></i>Crossword</a>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
        <div class="text-center max-w-2xl mx-auto space-y-2">
            <h2 class="text-3xl font-extrabold font-heading">Binary <i class="fa-solid fa-arrows-rotate text-brand-500 mx-1"></i> Decimal Converter</h2>
            <p class="text-sm text-slate-600 dark:text-slate-400">Convert numbers instantly between Binary (Base-2) and Decimal (Base-10).</p>
        </div>

        <div class="max-w-xl mx-auto glass p-8 rounded-3xl border border-slate-200/80 dark:border-slate-800 space-y-6">
            <!-- Binary Input -->
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Binary Input (Base 2)</label>
                <div class="relative">
                    <input type="text" id="binary-input" oninput="convertBinaryToDecimal()" placeholder="e.g. 101010" class="w-full px-4 py-3 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-brand-500">
                    <button onclick="copyValue('binary-input')" class="absolute right-3 top-3 text-slate-400 hover:text-brand-500 text-xs">
                        <i class="fa-regular fa-copy"></i>
                    </button>
                </div>
            </div>

            <!-- Arrow Graphic -->
            <div class="flex justify-center">
                <div class="w-10 h-10 rounded-full bg-brand-500/10 text-brand-500 flex items-center justify-center text-sm">
                    <i class="fa-solid fa-arrow-down-up-lock"></i>
                </div>
            </div>

            <!-- Decimal Input -->
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Decimal Output / Input (Base 10)</label>
                <div class="relative">
                    <input type="number" id="decimal-input" oninput="convertDecimalToBinary()" placeholder="e.g. 42" class="w-full px-4 py-3 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-brand-500">
                    <button onclick="copyValue('decimal-input')" class="absolute right-3 top-3 text-slate-400 hover:text-brand-500 text-xs">
                        <i class="fa-regular fa-copy"></i>
                    </button>
                </div>
            </div>

            <!-- Quick Presets -->
            <div class="pt-2 border-t border-slate-200 dark:border-slate-800">
                <span class="text-xs text-slate-400 block mb-2 font-medium">Quick Test Numbers:</span>
                <div class="flex flex-wrap gap-2">
                    <button onclick="setBinaryPreset('1010')" class="px-2.5 py-1 rounded-lg bg-slate-200 dark:bg-slate-800 text-xs font-mono hover:bg-brand-500 hover:text-white transition-colors">1010 (10)</button>
                    <button onclick="setBinaryPreset('11111111')" class="px-2.5 py-1 rounded-lg bg-slate-200 dark:bg-slate-800 text-xs font-mono hover:bg-brand-500 hover:text-white transition-colors">11111111 (255)</button>
                    <button onclick="setBinaryPreset('1000000000')" class="px-2.5 py-1 rounded-lg bg-slate-200 dark:bg-slate-800 text-xs font-mono hover:bg-brand-500 hover:text-white transition-colors">1000000000 (512)</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="mt-auto border-t border-slate-200/80 dark:border-slate-800 bg-white/50 dark:bg-slate-950/50 backdrop-blur-md py-6">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-500">
            <p>© <span id="current-year"></span> Schmidty. All rights reserved.</p>
            <div class="flex gap-4">
                <a href="index.html" class="hover:text-brand-500">Home</a>
                <a href="hobbies_page.html" class="hover:text-brand-500">Hobbies</a>
                <a href="projects_showcase_page.html" class="hover:text-brand-500">Projects</a>
                <a href="binary_decimal_converter_page.html" class="hover:text-brand-500">Binary</a>
                <a href="interactive_crossword_puzzle_page.html" class="hover:text-brand-500">Crossword</a>
            </div>
        </div>
    </footer>
</body>
</html>
